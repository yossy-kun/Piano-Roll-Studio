<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="ブラウザだけで使えるピアノロール中心の簡易DAW">
  <title>Piano Roll Studio — Browser DAW</title>
  <style>
    :root{
      --bg:#090b10;--panel:#11141b;--panel2:#171b24;--line:#292e3b;--line2:#363c4c;
      --text:#eef1f8;--muted:#8e96a9;--accent:#72f2bd;--accent2:#7c8cff;--danger:#ff647c;
      --track:#ffb45d;--radius:10px;--top:68px;--tracks:272px;
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    button,input,select{font:inherit;color:inherit;touch-action:manipulation} button{border:0}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .topbar{height:var(--top);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0d1016;box-shadow:0 8px 30px #0008;position:relative;z-index:4}
    .brand{display:flex;align-items:center;gap:9px;min-width:180px;font-weight:780;letter-spacing:-.03em}.mark{width:29px;height:29px;border:1px solid #ffffff26;border-radius:9px;background:conic-gradient(from 220deg,var(--accent),var(--accent2),var(--accent));box-shadow:0 0 24px #72f2bd26;position:relative}.mark:after{content:"";position:absolute;inset:6px;border-radius:5px;background:#0d1016}
    .transport{display:flex;align-items:center;gap:5px}.iconbtn,.toolbtn,.mini,.pillbtn{height:36px;min-width:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:.15s ease}.iconbtn:hover,.toolbtn:hover,.mini:hover,.pillbtn:hover{border-color:#4a5267;background:#202531}.iconbtn.primary{background:var(--accent);color:#09120f;border-color:transparent}.iconbtn.active,.toolbtn.active{border-color:var(--accent);color:var(--accent);background:#72f2bd15}.iconbtn.danger{color:var(--danger)}
    svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .counter{min-width:166px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:#080a0f;font-variant-numeric:tabular-nums}.counter strong{display:block;font-size:18px;line-height:1.05;letter-spacing:.07em}.counter span{font-size:11px;color:var(--muted)}
    .field{display:flex;align-items:center;gap:6px;padding-left:8px;border-left:1px solid var(--line)}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field select{height:34px;border:1px solid var(--line);border-radius:7px;background:#0b0e14;padding:0 8px}.field input{width:68px}.field select{width:76px}.spacer{flex:1}.export{position:relative}.export-menu{position:absolute;right:0;top:43px;min-width:176px;padding:6px;border:1px solid var(--line2);border-radius:10px;background:#171b24;box-shadow:0 16px 44px #000b;display:none}.export-menu.open{display:block}.export-menu button{width:100%;padding:9px 10px;text-align:left;border-radius:6px;background:transparent;cursor:pointer}.export-menu button:hover{background:#252b38}.export-menu small{display:block;color:var(--muted);margin-top:2px}.bank-menu,.project-menu{position:fixed;z-index:30;width:min(350px,calc(100vw - 16px));padding:7px;border:1px solid var(--line2);border-radius:10px;background:#171b24;box-shadow:0 18px 48px #000c;display:none}.bank-menu.open,.project-menu.open{display:block}.bank-add{width:100%;padding:9px 10px;border-radius:7px;background:#252b38;color:var(--accent);font-weight:700;cursor:pointer;text-align:left}.bank-add:hover{background:#2d3443}.bank-list{max-height:min(360px,60vh);overflow:auto;margin-top:6px}.bank-empty{padding:13px 9px;color:var(--muted);font-size:12px;text-align:center}.bank-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 7px;border-top:1px solid var(--line)}.bank-row strong,.bank-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bank-row strong{font-size:12px}.bank-row small{margin-top:2px;color:var(--muted);font-size:10px}.bank-remove{width:29px;height:29px;border-radius:6px;background:#ff647c12;color:var(--danger);cursor:pointer;font-size:18px}.bank-remove:hover{background:#ff647c25}.project-menu{width:min(430px,calc(100vw - 16px));padding:12px}.project-menu label{display:block;margin-bottom:5px;color:var(--muted);font-size:11px}.project-new{width:100%;height:35px;margin-bottom:10px;border:1px solid var(--line);border-radius:7px;background:#202632;color:var(--accent);cursor:pointer;font-weight:700}.project-name{width:100%;height:36px;border:1px solid var(--line2);border-radius:7px;background:#0b0e14;padding:0 10px;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}.project-name-status{min-height:17px;padding:4px 2px 0;font-size:10px;color:var(--accent)}.project-name-status.overwrite{color:#ffcf70}.project-autosave{display:flex!important;align-items:center;gap:7px;margin:8px 1px 0!important;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#0f131b;cursor:pointer}.project-autosave input{margin:0;accent-color:var(--accent)}.project-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:9px 0 12px}.project-actions button{min-height:35px;border:1px solid var(--line);border-radius:7px;background:#252b38;cursor:pointer;font-size:11px}.project-actions button:first-child{border-color:#72f2bd66;color:var(--accent)}.project-list-title{padding:8px 2px 5px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700}.project-list{max-height:min(330px,45vh);overflow:auto}.project-empty{padding:18px 8px;color:var(--muted);font-size:12px;text-align:center}.project-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:5px;align-items:center;padding:8px 2px;border-top:1px solid var(--line)}.project-row-info{min-width:0}.project-row strong,.project-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-row strong{font-size:12px}.project-row small{margin-top:2px;color:var(--muted);font-size:10px}.project-row button{height:30px;padding:0 8px;border-radius:6px;background:#252b38;cursor:pointer;font-size:11px}.project-row .project-delete{width:30px;padding:0;background:#ff647c12;color:var(--danger);font-size:17px}
    .app{height:calc(100% - var(--top));display:grid;grid-template-columns:var(--tracks) minmax(0,1fr);grid-template-rows:48px minmax(0,1fr) 33px}
    .track-head{grid-column:1;grid-row:1;display:flex;align-items:center;gap:7px;padding:7px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}.track-head b{font-size:13px;margin-right:auto}.mini{height:31px;min-width:31px}.mini span{font-size:12px}
    .editor-tools{grid-column:2;grid-row:1;display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel)}.toolbtn{height:31px;min-width:32px;padding:0 9px;font-size:12px}.sep{width:1px;height:22px;background:var(--line);margin:0 3px}.editor-tools label{font-size:11px;color:var(--muted)}.editor-tools select,.editor-tools input[type=number]{height:30px;border:1px solid var(--line);border-radius:7px;background:#0b0e14;padding:0 7px}.editor-tools select{width:90px}.editor-tools input[type=range]{width:85px;accent-color:var(--accent)}.editor-tools .velocity-value{width:64px;min-width:64px;padding-right:5px;text-align:right;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}.triplet-toggle{height:30px;display:inline-flex;align-items:center;gap:4px;padding:0 7px;border:1px solid var(--line);border-radius:7px;background:#0b0e14;cursor:pointer;white-space:nowrap}.triplet-toggle input{margin:0;accent-color:var(--accent)}
    .tracks{grid-column:1;grid-row:2;overflow-y:auto;border-right:1px solid var(--line);background:#0d1016;padding:8px}.track-card{position:relative;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:7px;cursor:pointer}.track-card:has(.sound-menu.open){z-index:3}.track-card.selected{border-color:var(--tc);box-shadow:inset 3px 0 var(--tc)}.track-main{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:7px;padding:9px}.track-num{width:23px;height:23px;border-radius:6px;background:color-mix(in srgb,var(--tc) 22%,transparent);color:var(--tc);display:grid;place-items:center;font-size:11px;font-weight:800}.track-name{min-width:0}.track-name input{width:100%;border:0;background:transparent;font-weight:700;padding:2px 0}.track-name small{font-size:10px;color:var(--muted)}.track-actions{display:flex;gap:3px}.track-actions button{width:25px;height:25px;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.track-actions button:hover{background:#252b38;color:var(--text)}
    .track-controls{display:grid;grid-template-columns:auto 1fr auto auto;gap:7px 8px;align-items:center;padding:7px 9px 9px;border-top:1px solid #242936}.track-controls label{font-size:10px;color:var(--muted)}.track-controls input[type=range]{width:100%;accent-color:var(--tc)}.control-value{width:44px;height:24px;border:1px solid var(--line);border-radius:5px;background:#0b0e14;padding:0 3px;text-align:right;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}.ms{display:flex;gap:3px;grid-column:4;grid-row:1/3}.ms button{width:26px;height:23px;border-radius:5px;background:#222733;color:var(--muted);font-size:10px;font-weight:800;cursor:pointer}.ms button.on{background:var(--tc);color:#0a0c10}.tracks *{-webkit-user-select:none;user-select:none}.track-name input:focus,.control-value:focus{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}.source-picker{grid-column:1/5;display:grid;grid-template-columns:32px minmax(0,1fr);gap:7px;align-items:center}.source-picker select{width:100%;height:28px;border:1px solid var(--line);border-radius:6px;background:#0b0e14;padding:0 6px;font-size:11px}.sound-picker{grid-column:1/5;position:relative}.sound-trigger{width:100%;height:28px;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:6px;background:#0b0e14;padding:0 7px;font-size:11px;cursor:pointer}.sound-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sound-trigger svg{width:13px;transition:transform .15s}.sound-trigger[aria-expanded=true] svg{transform:rotate(180deg)}.sound-menu{display:none;position:absolute;left:0;right:0;top:32px;z-index:20;padding:5px;border:1px solid var(--line2);border-radius:8px;background:#171b24;box-shadow:0 18px 44px #000d;max-height:300px;overflow:auto;cursor:default}.sound-menu.open{display:block}.sound-menu b{display:block;position:sticky;top:-5px;background:#171b24;padding:6px 7px 4px;color:var(--muted);font-size:10px;letter-spacing:.06em;z-index:1}.sound-menu button{display:block;width:100%;padding:7px;text-align:left;border-radius:5px;background:transparent;font-size:11px;white-space:normal;cursor:pointer}.sound-menu button:hover,.sound-menu button.selected{background:#2a3040;color:var(--accent)}
    .roll-wrap{grid-column:2;grid-row:2;min-width:0;min-height:0;position:relative;background:#0a0d12}.roll-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}.roll-scroll,.roll-content,.roll-scroll canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}.roll-content{position:relative;min-width:100%;min-height:100%}.roll-scroll canvas{display:block;position:sticky;left:0;top:0;cursor:crosshair}.roll-scroll.select canvas{cursor:default}.roll-scroll.panning canvas{cursor:grabbing}.roll-scroll.resize-hover canvas{cursor:ew-resize}.empty-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 15px;border:1px solid var(--line);border-radius:9px;background:#0c0f15d9;color:var(--muted);font-size:13px;pointer-events:none;display:none}
    .status{grid-column:1/3;grid-row:3;display:flex;align-items:center;padding:0 12px;border-top:1px solid var(--line);background:#0d1016;color:var(--muted);font-size:11px}.status .msg{color:var(--text);margin-right:auto}.status kbd{border:1px solid var(--line2);border-radius:4px;background:#181c24;padding:1px 5px;margin:0 3px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 10px var(--accent)}
    .toast{position:fixed;right:18px;bottom:48px;z-index:9;max-width:340px;padding:11px 14px;border:1px solid var(--line2);border-radius:9px;background:#1b202a;box-shadow:0 14px 42px #000a;font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.toast.error{border-color:#ff647c77}
    @media(max-width:900px){:root{--tracks:230px}.brand{min-width:auto}.brand span{display:none}.field.tempo label,.field.signature label{display:none}.counter{min-width:132px}.counter strong{font-size:15px}.topbar{gap:6px;padding-inline:8px}.editor-tools .optional{display:none}}
    @media(max-width:600px) and (orientation:portrait){
      :root{--top:56px}.topbar{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}.topbar::-webkit-scrollbar,.editor-tools::-webkit-scrollbar,.tracks::-webkit-scrollbar{display:none}.brand{display:none}.field.signature{display:none}.counter{min-width:124px}.field.tempo{padding-left:5px}.app{grid-template-columns:minmax(0,1fr);grid-template-rows:40px 190px 44px minmax(0,1fr) 29px}.track-head{grid-column:1;grid-row:1;border-right:0}.tracks{grid-column:1;grid-row:2;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding:6px;border-right:0;border-bottom:1px solid var(--line)}.track-card{flex:0 0 230px;margin:0}.sound-menu{max-height:105px}.editor-tools{grid-column:1;grid-row:3;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none}.editor-tools>*{flex-shrink:0}.editor-tools .spacer{min-width:8px}.roll-wrap{grid-column:1;grid-row:4}.status{grid-column:1;grid-row:5;overflow:hidden;white-space:nowrap}.status>span:last-child{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><i class="mark" aria-hidden="true"></i><span>Piano Roll Studio</span></div>
    <div class="transport" aria-label="トランスポート">
      <button class="iconbtn" id="stopBtn" title="停止して先頭に戻る" aria-label="停止して先頭に戻る"><svg viewBox="0 0 24 24"><path d="M5 5v14M19 5 8 12l11 7z"/></svg></button>
      <button class="iconbtn primary" id="playBtn" title="再生 / 一時停止 (Space)" aria-label="再生"><svg viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></svg></button>
      <button class="iconbtn" id="metroBtn" title="メトロノーム" aria-label="メトロノーム"><svg viewBox="0 0 24 24"><path d="M7 20h10l-2-16H9zM12 8l4-4M10 16h4"/></svg></button>
    </div>
    <div class="counter"><strong id="positionText">001 : 01 : 000</strong><span id="timeText">00:00.000</span></div>
    <div class="field tempo"><label for="bpm">Tempo</label><input id="bpm" type="number" min="30" max="300" value="120" aria-label="テンポ"></div>
    <div class="field signature"><label for="signature">拍子</label><select id="signature"><option>4/4</option><option>3/4</option><option>5/4</option><option>6/8</option><option>7/8</option></select></div>
    <div class="field bars"><label for="bars">小節</label><input id="bars" type="number" min="1" max="999" value="16" aria-label="小節数"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="undoBtn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></svg></button>
    <button class="iconbtn" id="redoBtn" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m4-5h-8a6 6 0 0 0-6 6"/></svg></button>
    <button class="pillbtn" id="projectBtn" title="プロジェクトの保存・読み込み" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 19V5h6l2 2h8v12zM8 11h8M8 15h5"/></svg><span>プロジェクト</span></button><input id="projectFile" type="file" accept=".json,application/json" hidden>
    <button class="pillbtn" id="sf2Btn" title="サウンドフォントを追加・削除" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M9 18V5l10-2v13M9 9l10-2M6 21c-2 0-3-1-3-2s1-2 3-2 3 1 3 2-1 2-3 2Zm10-2c-2 0-3-1-3-2s1-2 3-2 3 1 3 2-1 2-3 2Z"/></svg><span id="sf2Label">音源管理</span></button><input id="sf2File" type="file" multiple hidden>
    <div class="export">
      <button class="pillbtn" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 20h14"/></svg><span>書き出し</span></button>
      <div class="export-menu" id="exportMenu">
        <button data-export="wav">WAV<small>44.1 kHz / 16-bit</small></button>
        <button data-export="mp3">MP3<small>128 kbps</small></button>
        <button data-export="mid">MIDI<small>Standard MIDI File</small></button>
      </div>
    </div>
  </header>
  <div class="bank-menu" id="bankMenu"><button class="bank-add" id="addSoundBank">＋ サウンドフォントを追加</button><div class="bank-list" id="bankList"></div></div>
  <div class="project-menu" id="projectMenu"><button class="project-new" id="newProjectBtn">＋ 空の新規プロジェクト</button><label for="projectName">プロジェクト名</label><input class="project-name" id="projectName" maxlength="100" value="タイトルなし"><div class="project-name-status" id="projectNameStatus"></div><label class="project-autosave"><input id="projectAutoSave" type="checkbox">変更時にブラウザへ自動保存</label><div class="project-actions"><button id="saveBrowserProject">ブラウザに保存</button><button id="saveProjectFile">ファイルに保存</button><button id="loadProjectFile">ファイルを読込</button></div><div class="project-list-title">ブラウザ内のプロジェクト</div><div class="project-list" id="projectList"></div></div>

  <main class="app">
    <section class="track-head"><b>TRACKS</b><button class="mini" id="addTrack" title="トラック追加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="mini" id="duplicateTrack" title="選択トラックを複製"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><button class="mini" id="deleteTrack" title="選択トラックを削除"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/></svg></button></section>
    <section class="editor-tools" aria-label="ピアノロールツール">
      <button class="toolbtn active" data-tool="select" title="選択 (V)"><svg viewBox="0 0 24 24"><path d="m5 3 12 9-6 1-3 6z"/></svg><span>選択</span></button>
      <button class="toolbtn" data-tool="draw" title="描画 (B)"><svg viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16zM14 7l3 3"/></svg><span>描画</span></button>
      <div class="sep"></div>
      <button class="toolbtn" id="copyBtn" title="コピー (Ctrl+C)">コピー</button><button class="toolbtn optional" id="cutBtn" title="カット (Ctrl+X)">カット</button><button class="toolbtn" id="pasteBtn" title="ペースト (Ctrl+V)">ペースト</button><button class="toolbtn" id="deleteNotesBtn" title="選択中のノートを削除 (Delete)">削除</button>
      <div class="sep"></div><label for="snap">SNAP</label><select id="snap"><option value="4">全音符</option><option value="2">1/2</option><option value="1">1/4</option><option value="0.5" selected>1/8</option><option value="0.25">1/16</option><option value="0.125">1/32</option><option value="0.0625">1/64</option></select><label class="triplet-toggle"><input id="snapTriplet" type="checkbox">3連符</label>
      <label for="velocity">VEL</label><input id="velocity" type="range" min="0" max="127" value="100"><input class="velocity-value" id="velocityValue" type="number" inputmode="numeric" min="0" max="127" value="100" aria-label="ベロシティ値">
      <div class="spacer"></div><label>横</label><button class="mini" id="zoomXOut" title="横方向を縮小">−</button><span id="zoomXText" style="min-width:34px;text-align:center;font-size:11px;color:var(--muted)">100%</span><button class="mini" id="zoomXIn" title="横方向を拡大">＋</button><label>縦</label><button class="mini" id="zoomYOut" title="縦方向を縮小">−</button><span id="zoomYText" style="min-width:34px;text-align:center;font-size:11px;color:var(--muted)">100%</span><button class="mini" id="zoomYIn" title="縦方向を拡大">＋</button>
    </section>
    <aside class="tracks" id="tracks"></aside>
    <section class="roll-wrap"><div class="roll-scroll select" id="rollScroll"><div class="roll-content" id="rollContent"><canvas id="roll" aria-label="ピアノロール"></canvas></div></div><div class="empty-hint" id="emptyHint">描画ツールで音符を追加できます</div></section>
    <footer class="status"><span class="dot"></span><span class="msg" id="statusMsg">準備完了</span><span><kbd>Space</kbd>再生　<kbd>Del</kbd>削除　<kbd>中ドラッグ</kbd>移動　<kbd>右ドラッグ</kbd>範囲選択</span></footer>
  </main>
  <div class="toast" id="toast"></div>
